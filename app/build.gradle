plugins {
    id "com.android.application"
}

base {
    archivesName = "atoto-s8g1104ms-wifi-adb"
}

def signingStore = System.getenv("ATOTO_SIGNING_STORE")
def signingStorePassword = System.getenv("ATOTO_SIGNING_STORE_PASSWORD")
def signingKeyAlias = System.getenv("ATOTO_SIGNING_KEY_ALIAS")
def signingKeyPassword = System.getenv("ATOTO_SIGNING_KEY_PASSWORD")
def hasReleaseSigning = signingStore && signingStorePassword
        && signingKeyAlias && signingKeyPassword

android {
    namespace "com.atoqe.atoto.wifiadb"
    compileSdk 37

    defaultConfig {
        applicationId "com.atoqe.atoto.wifiadb"
        minSdk 23
        targetSdk 29
        versionCode 5
        versionName "1.3.0-s8g1104ms"
        manifestPlaceholders = [appLabel: "S8 Wi-Fi ADB (1104MS)"]
    }

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile file(signingStore)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            // Installs beside the release-signed app instead of clashing with it.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            manifestPlaceholders = [appLabel: "S8 Wi-Fi ADB (1104MS) debug"]
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        disable "ExpiredTargetSdkVersion"
        abortOnError true
    }
}
