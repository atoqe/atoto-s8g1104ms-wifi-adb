name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: cp app/build/outputs/apk/debug/atoto-s8g1104ms-wifi-adb-debug.apk atoto-s8g1104ms-wifi-adb.apk
      - uses: actions/upload-artifact@v4
        with:
          name: atoto-s8g1104ms-wifi-adb
          path: atoto-s8g1104ms-wifi-adb.apk

  # Pushing a v* tag builds the APK signed with the release key and attaches it
  # to that tag's GitHub release. Fails if the signing secrets are missing, so
  # an unsigned or debug-signed APK is never published.
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build signed release APK
        env:
          ATOTO_SIGNING_STORE: ${{ runner.temp }}/release.jks
          ATOTO_SIGNING_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ATOTO_SIGNING_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          ATOTO_SIGNING_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify signature
        run: |
          cp app/build/outputs/apk/release/atoto-s8g1104ms-wifi-adb-release.apk atoto-s8g1104ms-wifi-adb.apk
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs atoto-s8g1104ms-wifi-adb.apk
          if "$apksigner" verify --print-certs atoto-s8g1104ms-wifi-adb.apk | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with a debug key"
            exit 1
          fi
      - name: Attach APK to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" atoto-s8g1104ms-wifi-adb.apk --clobber
          else
            gh release create "$GITHUB_REF_NAME" atoto-s8g1104ms-wifi-adb.apk \
              --draft --verify-tag --title "S8G1104MS Wi-Fi ADB $GITHUB_REF_NAME"
          fi
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
