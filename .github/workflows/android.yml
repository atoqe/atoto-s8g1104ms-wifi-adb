name: Android build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - run: cp app/build/outputs/apk/debug/atoto-s8g1104ms-wifi-adb-debug.apk atoto-s8g1104ms-wifi-adb.apk
      - uses: actions/upload-artifact@v4
        with:
          name: atoto-s8g1104ms-wifi-adb
          path: atoto-s8g1104ms-wifi-adb.apk
